<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMerch Incident Report - Optimized</title>
    <link rel="icon" type="image/png" href="incident.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { 
            --bg: #f4f7f6; 
            --card-bg: #ffffff; 
            --text: #212529; 
            --accent: #dc3545;
        }
        [data-bs-theme="dark"] { 
            --bg: #1a1a1a; 
            --card-bg: #2d2d2d; 
            --text: #f8f9fa; 
        }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background 0.3s ease;
            min-height: 100vh;
        }

        /* Responsive Container */
        .container { max-width: 900px; padding: 20px; }

        /* Smooth 3D Card (Optimized - No Blur) */
        .card { 
            border: none;
            border-radius: 20px; 
            background: var(--card-bg);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-bottom: 5px solid #000;
        }

        .card-header { 
            background: #000 !important; 
            color: #fff; 
            border-radius: 20px 20px 0 0 !important; 
            padding: 15px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        #liveClock { 
            font-weight: 800; 
            color: var(--accent); 
            font-size: clamp(1rem, 4vw, 1.2rem); /* Responsive font */
        }

        /* Form Styling for Mobile/Desktop */
        .form-control, .form-select { 
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ddd;
            font-size: 16px; /* Prevents auto-zoom in iPhone */
        }

        .btn-submit { 
            background: #000; 
            color: #fff; 
            font-weight: 700; 
            padding: 15px; 
            border-radius: 12px; 
            border: none;
            transition: 0.2s ease;
        }
        .btn-submit:active { transform: scale(0.98); }

        /* Theme Toggle (Bottom Right) */
        .theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #000;
            color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        [data-bs-theme="dark"] .theme-btn { background: #fff; color: #000; }

        .logo-img { width: 100%; max-width: 180px; height: auto; }

        /* Media Query para sa Phone Specific Adjustments */
        @media (max-width: 768px) {
            .card-body { padding: 20px; }
            .btn-submit { font-size: 14px; }
            .row > div { margin-bottom: 10px; }
        }
    </style>
</head>
<body data-bs-theme="light">

    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">
        <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
    </button>

    <div class="container mt-2 mb-5">
        <div class="text-center mb-4">
            <img src="imerch.png" class="logo-img">
            <div id="liveClock" class="mt-2">LOADING CLOCK...</div>
        </div>

        <div class="card">
            <div class="card-header text-center uppercase">
                <i class="bi bi-shield-check me-2"></i>Incident Reporting Portal
            </div>
            <div class="card-body">
                <form id="incidentForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold small">REPORTER NAME</label>
                            <input type="text" id="fullname" class="form-control" placeholder="Type here..." required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold small">COORDINATOR / PIC</label>
                            <input type="text" id="coordinator" class="form-control" placeholder="Assigned PIC" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6 col-md-4 mb-3">
                            <label class="form-label fw-bold small">SOURCE</label>
                            <select id="source" class="form-select">
                                <option>PC Access</option>
                                <option>Mobile Access</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-4 mb-3">
                            <label class="form-label fw-bold small text-danger">DATE</label>
                            <input type="text" id="date" class="form-control text-center fw-bold bg-light" readonly>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold small text-danger">TIME (12H)</label>
                            <input type="text" id="time" class="form-control text-center fw-bold bg-light" readonly>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">INCIDENT DESCRIPTION</label>
                        <textarea id="description" class="form-control" rows="4" placeholder="Enter details..." required></textarea>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-primary"><i class="bi bi-paperclip me-1"></i>ATTACH EVIDENCE</label>
                        <input type="file" id="attachment" class="form-control form-control-sm" accept=".pdf,.doc,.docx,image/*">
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-submit w-100">
                        SUBMIT REPORT
                    </button>
                </form>
            </div>
        </div>
        <div class="text-center mt-3 text-muted" style="font-size: 11px;">
            © 2026 iMerch Media Inc. | System by Ronsanity
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwVMbY5vK_FjBPSqtSWW4fP39A3BQoSJLFqxt0mYJoRi7nKqfviOO824EQGhi7-3HCB/exec';

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            const isDark = body.getAttribute('data-bs-theme') === 'dark';
            body.setAttribute('data-bs-theme', isDark ? 'light' : 'dark');
            icon.className = isDark ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleString('en-US', { 
                month: 'short', day: 'numeric', year: 'numeric',
                hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true 
            });
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const yyyy = now.getFullYear();
            document.getElementById('date').value = `${mm}/${dd}/${yyyy}`;
            document.getElementById('time').value = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        }
        setInterval(updateTime, 1000); updateTime();

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('incidentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const fileInput = document.getElementById('attachment');
            btn.disabled = true;
            btn.innerText = "SENDING...";

            let fileData = null;
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const base64String = await getBase64(file);
                fileData = { base64: base64String.split(',')[1], type: file.type, name: file.name };
            }

            const formData = {
                fullname: document.getElementById('fullname').value,
                coordinator: document.getElementById('coordinator').value,
                source: document.getElementById('source').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                description: document.getElementById('description').value,
                attachment: fileData
            };

            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(formData) })
            .then(() => {
                alert("REPORT SENT!");
                document.getElementById('incidentForm').reset();
                updateTime();
            })
            .catch(() => alert("Error sending report."))
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "SUBMIT REPORT";
            });
        });
    </script>
</body>
</html>
