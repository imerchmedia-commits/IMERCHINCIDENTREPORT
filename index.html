<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMerch | Incident Report Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #004aad; --accent: #ff914d; --bg: #f4f7f6; --text: #2c3e50; --card: #ffffff; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; transition: 0.3s; }
        .container { max-width: 650px; margin: auto; background: var(--card); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        .header { text-align: center; margin-bottom: 25px; }
        .user-badge { background: #f0f4ff; color: var(--primary); padding: 10px 20px; border-radius: 30px; display: inline-flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.85rem; }
        .input-with-icon { position: relative; }
        .input-with-icon i { position: absolute; left: 15px; top: 14px; color: var(--primary); }
        input, select, textarea { width: 100%; padding: 12px 12px 12px 40px; border: 2px solid #e1e1e1; border-radius: 10px; box-sizing: border-box; }
        .date-row { display: flex; gap: 15px; }
        .date-row .form-group { flex: 1; }
        .btn-submit { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .footer-text { text-align: center; margin-top: 30px; font-size: 0.75rem; color: #888; }
        .footer-values { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginSection">
        <div class="header">
            <h2>Incident Report Portal</h2>
            <p>Please login with your @imerchmedia.net email</p>
        </div>
        <div class="form-group">
            <div class="input-with-icon">
                <i class="fas fa-envelope"></i>
                <input type="email" id="emailInput" placeholder="employee@imerchmedia.net">
            </div>
        </div>
        <button class="btn-submit" onclick="validateLogin()">Login to Access</button>
    </div>

    <div id="formSection" class="hidden">
        <div class="header">
            <h2>Incident Report Portal</h2>
            <div id="clock-display"></div>
        </div>

        <form id="incidentForm">
            <input type="hidden" name="reporterEmail" id="verifiedReporterEmail">
            <input type="hidden" name="reportDate" id="reportDate">

            <div style="text-align: center;">
                <div class="user-badge">
                    <i class="fas fa-user-circle"></i>
                    <span>Active Reporter: <b id="userEmailLabel"></b></span>
                </div>
            </div>

            <div class="date-row">
                <div class="form-group">
                    <label>Reporter Full Name</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" name="fullname" placeholder="Your name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Subject Name</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user-tag"></i>
                        <input type="text" name="subjectName" placeholder="Name of person involved" required>
                    </div>
                </div>
            </div>

            <div class="date-row">
                <div class="form-group">
                    <label>Location of Incident</label>
                    <div class="input-with-icon">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" name="location" placeholder="Where it happened" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Category of Offenses</label>
                    <div class="input-with-icon">
                        <i class="fas fa-gavel"></i>
                        <select name="incidentType" id="categorySelect" onchange="updateSpecificOffenses(this.value)" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="Attendance and Punctuality">Attendance and Punctuality</option>
                            <option value="Work Performance & Duty">Work Performance & Duty</option>
                            <option value="Offenses Against Authority">Offenses Against Authority</option>
                            <option value="Offenses Against Persons">Offenses Against Persons</option>
                            <option value="Offenses Against Company Property & Interests">Offenses Against Company Property & Interests</option>
                            <option value="Dishonesty">Dishonesty</option>
                            <option value="Offenses against Public Morals">Offenses against Public Morals</option>
                            <option value="Offenses Against Health and Safety">Offenses Against Health and Safety</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Specific Violation</label>
                <div class="input-with-icon">
                    <i class="fas fa-list-ul"></i>
                    <select name="specificViolation" id="specificViolation" required>
                        <option value="" disabled selected>Select Category first</option>
                    </select>
                </div>
            </div>

            <div class="date-row">
                <div class="form-group">
                    <label>Date of Incident</label>
                    <div class="input-with-icon">
                        <i class="fas fa-calendar-day"></i>
                        <input type="date" name="incidentDate" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Time of Incident</label>
                    <div class="input-with-icon">
                        <i class="fas fa-clock"></i>
                        <input type="time" name="time" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Detailed Description</label>
                <div class="input-with-icon">
                    <i class="fas fa-edit" style="top: 15px;"></i>
                    <textarea name="description" rows="4" style="padding-top:10px;" placeholder="Provide additional details..." required></textarea>
                </div>
            </div>

            <div class="form-group">
                <label>Attach Evidence</label>
                <input type="file" name="file" style="padding-left:12px;">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Submit Report</button>
        </form>
    </div>

    <div class="footer-text">
        &copy; 2026 iMerch Media Inc. | Developed By Ron Sarmenta
        <div class="footer-values">
            <span><i class="fas fa-heart"></i> Love</span>
            <span><i class="fas fa-hands-holding-child"></i> Care</span>
            <span><i class="fas fa-share-alt"></i> Share</span>
            <span><i class="fas fa-comments"></i> Communicate</span>
            <span><i class="fas fa-shield-alt"></i> Trust</span>
        </div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxptCQbfcq3CasBWXeHl7k0pq_nqzH0ZmRJHcEddv9e4trp42c2dblrOW-U5wVNFWXQ/exec';
    
    const offenses = {
        "Attendance and Punctuality": ["Failure to time-in/out", "Tardiness", "Habitual Absences", "AWOL"],
        "Work Performance & Duty": ["Poor performance", "SOP violation", "Negligence", "Loafing", "Sleeping"],
        "Offenses Against Authority": ["Disobedience", "Disrespect", "Insubordination", "Abuse of authority"],
        "Offenses Against Persons": ["Fighting", "Sexual harassment", "Bullying", "Libel"],
        "Offenses Against Company Property & Interests": ["Vandalism", "Theft", "Confidentiality breach", "Damage to equipment"],
        "Dishonesty": ["Falsified records", "Time padding", "Forgery", "Bribery", "Kickbacks"],
        "Offenses against Public Morals": ["Pornography", "Scandalous language", "Immoral acts"],
        "Offenses Against Health and Safety": ["Sanitary disregard", "Safety rule violation", "Electrical hazard"]
    };

    function validateLogin() {
        const email = document.getElementById('emailInput').value;
        if(email.endsWith('@imerchmedia.net')) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('formSection').classList.remove('hidden');
            document.getElementById('userEmailLabel').textContent = email;
            document.getElementById('verifiedReporterEmail').value = email;
            document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];
        } else {
            alert('Access Denied: Please use a valid iMerch email.');
        }
    }

    function updateSpecificOffenses(category) {
        const vSelect = document.getElementById('specificViolation');
        vSelect.innerHTML = '<option value="" disabled selected>Select Violation</option>';
        (offenses[category] || []).forEach(item => {
            const opt = document.createElement('option'); opt.value = item; opt.textContent = item;
            vSelect.appendChild(opt);
        });
    }

    function updateTime() {
        document.getElementById('clock-display').textContent = new Date().toLocaleString();
    }
    setInterval(updateTime, 1000); updateTime();

    document.getElementById('incidentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.textContent = "Submitting...";
        fetch(scriptURL, { method: 'POST', body: new FormData(this) })
            .then(() => { alert("Report submitted successfully!"); location.reload(); })
            .catch(error => alert("Error!"));
    });
</script>
</body>
</html>
