<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMerch Incident Report Portal</title>
    <link rel="icon" href="https://imerchmedia.ph/wp-content/uploads/2021/08/cropped-imerch-logo-32x32.png" sizes="32x32">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #004aad;
            --secondary-color: #002d6b;
            --accent-color: #ff914d;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section img {
            width: 150px;
            margin-bottom: 10px;
        }

        h2 {
            color: var(--secondary-color);
            margin: 0;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: #666;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--secondary-color);
            font-size: 0.9rem;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e1e1e1;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        textarea {
            padding-left: 45px;
            resize: vertical;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(0, 74, 173, 0.1);
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Responsive for mobile */
        @media (max-width: 480px) {
            .date-row {
                grid-template-columns: 1fr;
            }
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 74, 173, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.8rem;
            color: #888;
        }

        /* Success/Error States */
        .loader {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-section">
        <img src="imerch.png" alt="iMerch Logo">
        <h2>Incident Report Portal</h2>
        <p class="subtitle">Ensuring Excellence through Accountability</p>
    </div>

    <form id="incidentForm">
        <div class="form-group">
            <label>Reporter Name</label>
            <div class="input-with-icon">
                <i class="fas fa-user"></i>
                <input type="text" name="reporterName" placeholder="Enter your full name" required>
            </div>
        </div>

        <div class="date-row">
            <div class="form-group">
                <label>Date Reported</label>
                <div class="input-with-icon">
                    <i class="fas fa-calendar-check"></i>
                    <input type="date" id="reportDate" name="reportDate" required>
                </div>
            </div>

            <div class="form-group">
                <label>Actual Incident Date</label>
                <div class="input-with-icon">
                    <i class="fas fa-calendar-day"></i>
                    <input type="date" name="incidentDate" required>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Incident Category</label>
            <div class="input-with-icon">
                <i class="fas fa-tags"></i>
                <select name="incidentType" required>
                    <option value="" disabled selected>Select category</option>
                    <option value="Attendance">Attendance/Punctuality</option>
                    <option value="Operational">Operational Lapse</option>
                    <option value="Technical">Technical Issue</option>
                    <option value="Behavioral">Behavioral Conduct</option>
                    <option value="Safety">Safety/Security</option>
                    <option value="Others">Others</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Detailed Description</label>
            <div class="input-with-icon">
                <i class="fas fa-edit" style="top: 25px;"></i>
                <textarea name="description" rows="4" placeholder="Describe what happened in detail..." required></textarea>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
            <span>Submit Report</span>
            <div class="loader" id="loader"></div>
            <i class="fas fa-paper-plane" id="planeIcon"></i>
        </button>
    </form>

    <div class="footer-text">
        &copy; 2026 iMerch Media Inc. Systems Management
    </div>
</div>

<script>
    // Set default date to today for "Date Reported"
    document.getElementById('reportDate').valueAsDate = new Date();

    const scriptURL = 'YOUR_GOOGLE_SCRIPT_URL_HERE';
    const form = document.getElementById('incidentForm');
    const btn = document.getElementById('submitBtn');
    const loader = document.getElementById('loader');
    const icon = document.getElementById('planeIcon');

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        btn.disabled = true;
        loader.style.display = 'block';
        icon.style.display = 'none';

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                alert('Success! Incident report has been logged.');
                form.reset();
                document.getElementById('reportDate').valueAsDate = new Date();
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert('An error occurred. Please try again.');
            })
            .finally(() => {
                btn.disabled = false;
                loader.style.display = 'none';
                icon.style.display = 'block';
            });
    });
</script>

</body>
</html>
