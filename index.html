<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMerch Incident Report Portal</title>
    
    <link rel="icon" href="incident.png" type="image/png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --primary-color: #004aad;
            --secondary-color: #002d6b;
            --accent-color: #ff914d;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --border-color: #e1e1e1;
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-sub: #b0b0b0;
            --border-color: #333333;
            --input-bg: #2d2d2d;
            --secondary-color: #4da3ff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }

        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 1000;
            transition: 0.3s;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-section img {
            width: 150px;
            margin-bottom: 10px;
        }

        h2 {
            color: var(--secondary-color);
            margin: 0;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        #clock-display {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 20px;
            min-height: 20px;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.85rem;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            font-size: 1rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--text-main);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        textarea {
            padding-left: 45px;
            resize: vertical;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(0, 74, 173, 0.1);
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 480px) {
            .date-row { grid-template-columns: 1fr; }
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 74, 173, 0.3);
        }

        .loader {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        /* Identity Block UI Elements */
        #loginSection {
            text-align: center;
            padding: 30px 10px;
        }
        #incidentForm {
            display: none; /* Nakatago bago mag-login */
        }
        .user-badge {
            background: rgba(0, 74, 173, 0.08);
            border: 1px solid var(--primary-color);
            padding: 10px 18px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            font-size: 0.88rem;
            color: var(--text-main);
        }
        [data-theme="dark"] .user-badge {
            background: rgba(77, 163, 255, 0.15);
            border-color: var(--secondary-color);
        }
        .user-badge img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }
    </style>
</head>
<body data-theme="light">

    <button class="theme-switch" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
        <i class="fas fa-moon" id="theme-icon"></i>
    </button>

    <div class="container">
        <div class="logo-section">
            <img src="imerch.png" alt="iMerch Logo">
            <h2>Incident Report Portal</h2>
            <p class="subtitle">Ensuring Excellence through Accountability</p>
            <div id="clock-display">Loading time...</div>
        </div>

        <div id="loginSection">
            <p style="color: var(--text-sub); font-size: 0.95rem; margin-bottom: 25px;">
                Please verify your employee account to log an incident report.
            </p>
            <div style="display: flex; justify-content: center;">
                <div id="g_id_onload"
                     data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="pill"
                     data-theme="filled_blue"
                     data-text="signin_with"
                     data-size="large"
                     data-logo_alignment="left">
                </div>
            </div>
        </div>

        <form id="incidentForm">
            
            <div style="text-align: center;">
                <div class="user-badge">
                    <img id="userPhoto" src="" alt="User profile">
                    <span>Active Reporter: <b id="userEmailLabel"></b></span>
                </div>
            </div>

            <input type="hidden" name="reporterEmail" id="verifiedReporterEmail">
            <input type="hidden" name="reportDate" id="reportDate">

            <div class="date-row">
                <div class="form-group">
                    <label>Reporter Full Name</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" name="fullname" placeholder="Your name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Subject Name</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user-tag"></i>
                        <input type="text" name="subjectName" placeholder="Name of person involved" required>
                    </div>
                </div>
            </div>

            <div class="date-row">
                <div class="form-group">
                    <label>Location of Incident</label>
                    <div class="input-with-icon">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" name="location" placeholder="Where it happened" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Category of Offenses</label>
                    <div class="input-with-icon">
                        <i class="fas fa-gavel"></i>
                        <select name="incidentType" id="categorySelect" onchange="updateSpecificOffenses(this.value)" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="Attendance and Punctuality">Attendance and Punctuality</option>
                            <option value="Work Performance & Duty">Work Performance & Duty</option>
                            <option value="Offenses Against Authority">Offenses Against Authority</option>
                            <option value="Offenses Against Persons">Offenses Against Persons</option>
                            <option value="Offenses Against Company Property & Interests">Offenses Against Company Property & Interests</option>
                            <option value="Dishonesty">Dishonesty</option>
                            <option value="Offenses against Public Morals">Offenses against Public Morals</option>
                            <option value="Offenses Against Health and Safety">Offenses Against Health and Safety</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Specific Violation</label>
                <div class="input-with-icon">
                    <i class="fas fa-list-ul"></i>
                    <select name="specificViolation" id="specificViolation" required>
                        <option value="" disabled selected>Please select a category first</option>
                    </select>
                </div>
            </div>

            <div class="date-row">
                <div class="form-group">
                    <label>Date of Incident</label>
                    <div class="input-with-icon">
                        <i class="fas fa-calendar-day"></i>
                        <input type="date" name="incidentDate" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Time of Incident</label>
                    <div class="input-with-icon">
                        <i class="fas fa-clock"></i>
                        <input type="time" name="time" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Detailed Description</label>
                <div class="input-with-icon">
                    <i class="fas fa-edit" style="top: 22px;"></i>
                    <textarea name="description" rows="4" placeholder="Provide additional details (No character limit)..." required></textarea>
                </div>
            </div>

            <div class="form-group">
                <label>Attachments (Evidence/Multiple Files)</label>
                <div class="input-with-icon">
                    <i class="fas fa-paperclip"></i>
                    <input type="file" id="fileInput" name="attachments" multiple accept="image/*,.pdf,.doc,.docx">
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span>Submit Report</span>
                <div class="loader" id="loader"></div>
                <i class="fas fa-paper-plane" id="planeIcon"></i>
            </button>
        </form>

        <div class="footer-text">
            &copy; 2026 iMerch Media Inc. | System by Ronsanity
        </div>
    </div>

    <script>
        const offenses = {
            "Attendance and Punctuality": [
                "1. Failure to time-in and/or time-out on the time record.",
                "2. Failure to sign on the time record.",
                "3. Loss of time record",
                "4. Tardiness – exceeding the grace period of 15 minutes.",
                "5. Habitual Tardiness- Three (3) times a month",
                "6. Habitual Absences – Two (2) absences in a month (non-medical)",
                "7. Absence Without Leave (AWOL) which hampered the operations.",
                "8. Absence Without Official Leave of three (3) (non)/consecutive days.",
                "9. Failure to report absence or file a leave of absence on date incurred",
                "10. Failure to notify superior of absence/ tardiness",
                "11. Malingering or pretending to be sick or giving false excuses.",
                "12. Tampering or falsifying time record.",
                "13. Quitting work before dismissal time or under time without permission.",
                "14. Failure to attend official company meetings or activities."
            ],
            "Work Performance & Duty": [
                "1. Failure to perform required work according to company standards.",
                "2. Engaging in non-work related activities during official working hours.",
                "3. Engaging in unauthorized activities (selling/promoting) within premises.",
                "4. Failure to submit required reports on time.",
                "5. Submission of incomplete reports.",
                "6. Non-submission of reports as required by superior.",
                "7. Deviation of work schedule without prior approval.",
                "8. Failure to answer communications (email, SMS, calls) within the day.",
                "9. Failure to observe established SOPs in equipment or service.",
                "10. Failure to observe and implement health and safety measures.",
                "11. Gross negligence in general.",
                "12. Gross Negligence causing serious damage to company or client.",
                "13. Failure to pull-out expired products in the selling area.",
                "14. Reporting for work under influence of liquor or drugs.",
                "15. Drinking liquor while on duty.",
                "16. Engaging in or holding unofficial/unauthorized meetings.",
                "17. Loafing or wasting time, prolonging rest periods.",
                "18. Loitering, sleeping, or napping during official working hours.",
                "19. Gambling within office or work premises.",
                "20. Engaging in horseplay, making excessive noise within premises.",
                "21. Leaving place of work within working hours without permission.",
                "22. Failure to immediately report a personnel injury on Company time.",
                "23. Failure to notify HR of personal data changes within 7 days.",
                "24. Causing loss of time or money to company because of negligence.",
                "25. Use of company equipment for social networking or games.",
                "26. Installing unauthorized and unlicensed software in company computers.",
                "27. Offering or accepting anything of value for job assignment."
            ],
            "Offenses Against Authority": [
                "1. Failure to report for overtime work after having agreed to do so.",
                "2. Failure to follow directives/instructions from company authorities.",
                "3. Any act constituting disrespect or contempt for company authorities.",
                "4. Threat or intimidation against a Company authority with intent to harm.",
                "5. Willfully holding back, slowing down, or hindering work output.",
                "6. Refusing to accept or carry out official assignments from superiors.",
                "7. Insubordination in general.",
                "8. Refusing to cooperate with company officials in investigations.",
                "9. Grave abuse of authority by instructing subordinates to act against policy.",
                "10. Performing acts/transactions binding the Company without authority."
            ],
            "Offenses Against Persons": [
                "1. Inciting/provoking a fight or causing bodily harm/injury.",
                "2. Threat, intimidation, or coercion against fellow employees.",
                "3. Using profane/obscene words or insulting dignity of others.",
                "4. Lending or borrowing money from co-workers.",
                "5. Stealing or attempt to steal from co-workers.",
                "6. Sexual harassment on co-workers/clients/suppliers.",
                "7. Giving false accusations or testimony against others.",
                "8. Engaging in gossips about fellow employees.",
                "9. Bashing or bullying co-workers.",
                "10. Spreading offensive material via mobile/internet to degrade a person.",
                "11. Grossly scandalous or indecent language in addressing customers.",
                "12. Discourteous acts or grave threats towards customers/clients.",
                "13. Any and all immoral acts including sexual harassment of customers.",
                "14. Making false, vicious, or malicious statements concerning customers.",
                "15. Offense against honor (libel, defamation, slander) against customers."
            ],
            "Offenses Against Company Property & Interests": [
                "1. Failure to comply with procedures in operation of machines/equipment.",
                "2. Using company property or tools without permission or authority.",
                "3. Defacing company fixture/logo, vandalism, or dirtying of walls.",
                "4. Destruction, damage or misuse of property through carelessness.",
                "5. Theft, robbery or appropriation of property for personal gain.",
                "6. Malversation, misappropriation or unauthorized disbursement of funds.",
                "7. Pilferage of company property or products of clients.",
                "8. Engaging in unauthorized sale of property for personal benefit.",
                "9. Swindling (estafa) or taking (theft) of company funds or property.",
                "10. Using company time/materials/equipment for unauthorized work.",
                "11. Substituting company materials/equipment with poorer quality ones.",
                "12. Unauthorized alteration or removal of property from premises.",
                "13. Misrepresentation or unauthorized transactions using company name.",
                "14. Using mobile/internet to spread material that damages reputation.",
                "15. Disclosure or release of company/client confidential information.",
                "16. Willful concealment of material information concerning company interest.",
                "17. Unauthorized opening, removal, or destruction of documents/records."
            ],
            "Dishonesty": [
                "1. Giving false testimony during investigation or fact-finding process.",
                "2. Giving false information in general.",
                "3. Tampering job cards or making false reports on work (time padding).",
                "4. Conniving with subordinates in falsifying any documents.",
                "5. Falsification or misrepresentation of personal records for employment.",
                "6. Attempt to falsify or pad travel expenses, receipts, or invoices.",
                "7. Falsifying any written statement or making misleading information.",
                "8. Forgery.",
                "9. Engaging or conniving in anomalous transactions.",
                "10. Bribery or offering/accepting anything of value for job assignment.",
                "11. Favoring suppliers/customers in consideration of kickbacks.",
                "12. Intentionally punching or writing on timecard of another employee.",
                "13. Falsifying Personnel or Company Records."
            ],
            "Offenses against Public Morals": [
                "1. Showing or exhibiting pornographic materials, pictures or literature.",
                "2. Conduct of grossly scandalous or indecent language within premises.",
                "3. Showing discourteous acts towards co-employees, suppliers, or customers.",
                "4. Direct involvement in any scandal or crime.",
                "5. Sexual harassment of male or female employees/clients/suppliers.",
                "6. Carrying deadly weapons or any prohibited drugs.",
                "7. Direct involvement/connivance with a criminal organization."
            ],
            "Offenses Against Health and Safety": [
                "1. Disregard of company directives relating to sanitary conditions.",
                "2. Refusal or failure to follow safety rules.",
                "3. Refusal or failure to submit oneself to a Medical Examination.",
                "4. Reporting for work having serious contagious disease without reporting.",
                "5. Failure to shut down or unplug electrical equipment before leaving.",
                "6. Failure to clean assigned working areas to promote good hygiene.",
                "7. Failure to report damaged equipment or furniture.",
                "8. Failure to immediately report an accident or injury involving personnel."
            ]
        };

        function updateSpecificOffenses(category) {
            const violationSelect = document.getElementById('specificViolation');
            violationSelect.innerHTML = '<option value="" disabled selected>Select Violation</option>';
            
            if (offenses[category]) {
                offenses[category].forEach(item => {
                    const option = document.createElement('option');
                    option.value = item;
                    option.textContent = item;
                    violationSelect.appendChild(option);
                });
            }
        }

        function updateTime() {
            const now = new Date();
            const options = { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true 
            };
            document.getElementById('clock-display').textContent = now.toLocaleString('en-US', options);
        }
        setInterval(updateTime, 1000);
        updateTime();

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                icon.className = 'fas fa-sun';
            } else {
                body.setAttribute('data-theme', 'light');
                icon.className = 'fas fa-moon';
            }
        }

        // Set baseline capture timestamp
        document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];

        // GOOGLE APP SCRIPT CONFIGURATION
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzf8j2oZmIl4OwS6jxmmYGmN5NHK76eiRqNZ3QkV6OyAtR3rTOJooV9ghqRA62Qir0e/exec';
        const form = document.getElementById('incidentForm');

        // JWT Token Decoder for Credentials
        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Token Handler when user passes Google Authentication
        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            
            // Map payloads to internal system configs
            document.getElementById('verifiedReporterEmail').value = responsePayload.email;
            document.getElementById('userEmailLabel').textContent = responsePayload.email;
            document.getElementById('userPhoto').src = responsePayload.picture;
            
            // Interface Transitions
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('incidentForm').style.display = 'block';
        }

        // Form Submit Handler
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const icon = document.getElementById('planeIcon');

            btn.disabled = true;
            loader.style.display = 'block';
            icon.style.display = 'none';

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            const fileInput = document.getElementById('fileInput');
            const files = fileInput.files;
            const attachments = [];

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const base64Data = await toBase64(file);
                attachments.push({
                    base64: base64Data.split(',')[1],
                    type: file.type,
                    name: file.name
                });
            }
            data.attachments = attachments;

            fetch(scriptURL, { 
                method: 'POST', 
                body: JSON.stringify(data)
            })
            .then(res => {
                alert('Success! Incident report submitted.');
                form.reset();
                updateSpecificOffenses(''); 
                document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];
            })
            .catch(err => alert('Error: ' + err.message))
            .finally(() => {
                btn.disabled = false;
                loader.style.display = 'none';
                icon.style.display = 'block';
            });
        });

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    </script>
</body>
</html>
