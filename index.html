<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMerch | Incident Report Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #004aad; --accent: #ff914d; --bg: #f4f7f6; --text: #2c3e50; --card: #ffffff; }
        [data-theme="dark"] { --bg: #1a1a1a; --text: #ffffff; --card: #2d2d2d; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; transition: 0.3s; }
        .container { max-width: 650px; margin: auto; background: var(--card); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 25px; }
        .user-badge { background: #f0f4ff; color: var(--primary); padding: 10px 20px; border-radius: 30px; display: inline-flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.85rem; }
        .input-with-icon { position: relative; }
        .input-with-icon i { position: absolute; left: 15px; top: 14px; color: var(--primary); }
        input, select, textarea { width: 100%; padding: 12px 12px 12px 40px; border: 2px solid #e1e1e1; border-radius: 10px; box-sizing: border-box; }
        .date-row { display: flex; gap: 15px; }
        .date-row .form-group { flex: 1; }
        .btn-submit { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .footer-text { text-align: center; margin-top: 30px; font-size: 0.75rem; color: #888; }
        .footer-values { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div class="header">
        <h2>Incident Report Portal</h2>
        <div id="clock-display"></div>
        <button onclick="toggleTheme()" style="margin-top:10px; cursor:pointer;"><i id="theme-icon" class="fas fa-moon"></i></button>
    </div>

    <form id="incidentForm">
        <div style="text-align: center;">
            <div class="user-badge">
                <i class="fas fa-user-circle"></i>
                <span>Active Reporter: <b id="userEmailLabel">User</b></span>
            </div>
        </div>

        <input type="hidden" name="reporterEmail" id="verifiedReporterEmail">
        <input type="hidden" name="reportDate" id="reportDate">

        <div class="date-row">
            <div class="form-group">
                <label>Reporter Full Name</label>
                <div class="input-with-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" name="fullname" placeholder="Your name" required>
                </div>
            </div>
            <div class="form-group">
                <label>Subject Name</label>
                <div class="input-with-icon">
                    <i class="fas fa-user-tag"></i>
                    <input type="text" name="subjectName" placeholder="Name of person involved" required>
                </div>
            </div>
        </div>

        <div class="date-row">
            <div class="form-group">
                <label>Location of Incident</label>
                <div class="input-with-icon">
                    <i class="fas fa-map-marker-alt"></i>
                    <input type="text" name="location" placeholder="Where it happened" required>
                </div>
            </div>
            <div class="form-group">
                <label>Category of Offenses</label>
                <div class="input-with-icon">
                    <i class="fas fa-gavel"></i>
                    <select name="incidentType" id="categorySelect" onchange="updateSpecificOffenses(this.value)" required>
                        <option value="" disabled selected>Select Category</option>
                        <option value="Attendance and Punctuality">Attendance and Punctuality</option>
                        <option value="Work Performance & Duty">Work Performance & Duty</option>
                        <option value="Offenses Against Authority">Offenses Against Authority</option>
                        <option value="Offenses Against Persons">Offenses Against Persons</option>
                        <option value="Offenses Against Company Property & Interests">Offenses Against Company Property & Interests</option>
                        <option value="Dishonesty">Dishonesty</option>
                        <option value="Offenses against Public Morals">Offenses against Public Morals</option>
                        <option value="Offenses Against Health and Safety">Offenses Against Health and Safety</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Specific Violation</label>
            <div class="input-with-icon">
                <i class="fas fa-list-ul"></i>
                <select name="specificViolation" id="specificViolation" required>
                    <option value="" disabled selected>Please select a category first</option>
                </select>
            </div>
        </div>

        <div class="date-row">
            <div class="form-group">
                <label>Date of Incident</label>
                <div class="input-with-icon">
                    <i class="fas fa-calendar-day"></i>
                    <input type="date" name="incidentDate" required>
                </div>
            </div>
            <div class="form-group">
                <label>Time of Incident</label>
                <div class="input-with-icon">
                    <i class="fas fa-clock"></i>
                    <input type="time" name="time" required>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Detailed Description</label>
            <div class="input-with-icon">
                <i class="fas fa-edit" style="top: 22px;"></i>
                <textarea name="description" rows="4" placeholder="Provide additional details..." required></textarea>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
            <span>Submit Report</span>
            <i class="fas fa-paper-plane"></i>
        </button>
    </form>

    <div class="footer-text">
        &copy; 2026 iMerch Media Inc. | Developed By Ron Sarmenta
        <div class="footer-values">
            <span><i class="fas fa-heart"></i> Love</span>
            <span><i class="fas fa-hands-holding-child"></i> Care</span>
            <span><i class="fas fa-share-nodes"></i> Share</span>
        </div>
    </div>
</div>

<script>
    const offenses = {
        "Attendance and Punctuality": ["1. Failure to time-in/out", "2. Failure to sign", "3. Loss of time record", "4. Tardiness", "5. Habitual Tardiness", "6. Habitual Absences", "7. AWOL", "8. AWOL (3 days)", "9. Failure to file leave", "10. Failure to notify", "11. Malingering", "12. Falsifying time record", "13. Undertime", "14. Failure to attend meetings"],
        "Work Performance & Duty": ["1. Poor performance", "2. Non-work activities", "3. Unauthorized selling", "4. Late reports", "5. Incomplete reports", "6. Non-submission", "7. Deviation of schedule", "8. Failure to answer comms", "9. SOP violation", "10. Health/Safety", "11. Negligence", "12. Gross negligence", "13. Expired products", "14. Under influence", "15. Drinking", "16. Unauthorized meetings", "17. Loafing", "18. Sleeping", "19. Gambling", "20. Horseplay", "21. Leaving post", "22. Failure to report injury", "23. Data change notif", "24. Causing loss", "25. Equipment misuse", "26. Unauthorized software", "27. Job assignment bribery"],
        "Offenses Against Authority": ["1. No-show OT", "2. Disobedience", "3. Disrespect", "4. Threat", "5. Sabotage", "6. Refusal of assignment", "7. Insubordination", "8. Non-cooperation", "9. Abuse of authority", "10. Unauthorized transaction"],
        "Offenses Against Persons": ["1. Fighting", "2. Threat/Intimidation", "3. Profanity", "4. Money lending", "5. Stealing", "6. Sexual harassment", "7. False accusations", "8. Gossiping", "9. Bullying", "10. Offensive material", "11. Indecent language", "12. Discourtesy", "13. Immoral acts", "14. Malicious statements", "15. Libel"],
        "Offenses Against Company Property & Interests": ["1. Machine SOP", "2. Unauthorized use", "3. Vandalism", "4. Damage", "5. Theft", "6. Malversation", "7. Pilferage", "8. Unauthorized sale", "9. Estafa", "10. Unauthorized work", "11. Substituting materials", "12. Unauthorized removal", "13. Misrepresentation", "14. Reputation damage", "15. Confidentiality breach", "16. Concealment", "17. Destruction of records"],
        "Dishonesty": ["1. False testimony", "2. False info", "3. Time padding", "4. Connivance", "5. Falsified records", "6. Expense padding", "7. Misleading statements", "8. Forgery", "9. Anomalous transactions", "10. Bribery", "11. Kickbacks", "12. Buddy punching", "13. Falsifying official records"],
        "Offenses against Public Morals": ["1. Pornography", "2. Scandalous language", "3. Discourteous acts", "4. Criminal involvement", "5. Sexual harassment", "6. Weapons/drugs", "7. Criminal organization"],
        "Offenses Against Health and Safety": ["1. Sanitary disregard", "2. Safety rule violation", "3. Medical exam refusal", "4. Contagious disease", "5. Electrical hazard", "6. Poor hygiene", "7. Damage to equipment", "8. Failure to report accident"]
    };

    function updateSpecificOffenses(category) {
        const vSelect = document.getElementById('specificViolation');
        vSelect.innerHTML = '<option value="" disabled selected>Select Violation</option>';
        (offenses[category] || []).forEach(item => {
            const opt = document.createElement('option'); opt.value = item; opt.textContent = item;
            vSelect.appendChild(opt);
        });
    }

    function updateTime() {
        document.getElementById('clock-display').textContent = new Date().toLocaleString();
    }
    setInterval(updateTime, 1000); updateTime();

    function toggleTheme() {
        const body = document.body;
        const icon = document.getElementById('theme-icon');
        const isLight = body.getAttribute('data-theme') === 'light';
        body.setAttribute('data-theme', isLight ? 'dark' : 'light');
        icon.className = isLight ? 'fas fa-sun' : 'fas fa-moon';
    }

    document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];
    const form = document.getElementById('incidentForm');
</script>
</body>
</html>
