<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMerch Incident Report - Ronsanity</title>
    <link rel="icon" type="image/png" href="incident.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg: #f8f9fa; --card-bg: #ffffff; --text: #212529; }
        [data-bs-theme="dark"] { --bg: #121212; --card-bg: #1e1e1e; --text: #f8f9fa; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; transition: 0.3s; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .card-header { background: #000 !important; color: #fff; border-radius: 15px 15px 0 0 !important; }
        #liveClock { font-weight: 800; color: #dc3545; }
        .btn-submit { background: #000; color: #fff; font-weight: bold; padding: 12px; border-radius: 8px; }
        .file-info { font-size: 0.75rem; color: #6c757d; }
    </style>
</head>
<body data-bs-theme="light">

    <div class="container mt-4 mb-5">
        <div class="text-center mb-4">
            <img src="imerch.png" style="max-width: 200px;">
            <div id="liveClock" class="mt-2 text-uppercase">SYSTEM CLOCK LOADING...</div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header text-center"><h5>INCIDENT REPORT MODULE</h5></div>
                    <div class="card-body p-4">
                        <form id="incidentForm">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">REPORTER NAME</label>
                                    <input type="text" id="fullname" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">COORDINATOR / PIC</label>
                                    <input type="text" id="coordinator" class="form-control" required>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-bold small">SOURCE</label>
                                    <select id="source" class="form-select">
                                        <option>Web App (PC/Laptop)</option>
                                        <option>Mobile Phone</option>
                                    </select>
                                </div>
                                <div class="col-md-4"><label class="form-label fw-bold small text-danger">DATE</label><input type="text" id="date" class="form-control" readonly></div>
                                <div class="col-md-4"><label class="form-label fw-bold small text-danger">TIME</label><input type="text" id="time" class="form-control" readonly></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">DESCRIPTION / REMARKS</label>
                                <textarea id="description" class="form-control" rows="4" required></textarea>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold small text-primary"><i class="bi bi-paperclip"></i> ATTACH DOCUMENT (PDF, WORD, IMAGE)</label>
                                <input type="file" id="attachment" class="form-control form-control-sm" accept=".pdf,.doc,.docx,image/*">
                                <div class="file-info mt-1">Maximum file size: 5MB</div>
                            </div>

                            <button type="submit" id="submitBtn" class="btn btn-submit w-100">SUBMIT TO DATABASE</button>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-3 small text-muted">System by Ronsanity</div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzTvK08F3aGDw67VlkVCkMYoKFEv5o1xTTtopDD0BUZzg9q2Pc0_9gdHXE4rDQYp0p1/exec';

        function updateTime() {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleString();
            document.getElementById('date').value = now.toLocaleDateString();
            document.getElementById('time').value = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
        setInterval(updateTime, 1000); updateTime();

        // Helper function para gawing Base64 ang file
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('incidentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const fileInput = document.getElementById('attachment');
            
            btn.disabled = true;
            btn.innerText = "PROCESSING REPORT...";

            let fileData = null;

            // I-process ang file kung meron
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                if (file.size > 5 * 1024 * 1024) { // 5MB limit check
                    alert("File is too large. Maximum size is 5MB.");
                    btn.disabled = false;
                    btn.innerText = "SUBMIT TO DATABASE";
                    return;
                }
                const base64String = await getBase64(file);
                fileData = {
                    base64: base64String.split(',')[1],
                    type: file.type,
                    name: file.name
                };
            }

            const formData = {
                fullname: document.getElementById('fullname').value,
                coordinator: document.getElementById('coordinator').value,
                source: document.getElementById('source').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                description: document.getElementById('description').value,
                attachment: fileData // Isasama na ang file info
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(formData)
            })
            .then(() => {
                alert("SUCCESS: Report has been submitted with attachment!");
                document.getElementById('incidentForm').reset();
                updateTime();
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert("An error occurred, but please check your email/sheet.");
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "SUBMIT TO DATABASE";
            });
        });
    </script>
</body>
</html>
