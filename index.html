<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMerch Incident Report Portal</title>
    
    <link rel="icon" href="incident.png" type="image/png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #004aad;
            --secondary-color: #002d6b;
            --accent-color: #ff914d;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --border-color: #e1e1e1;
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-sub: #b0b0b0;
            --border-color: #333333;
            --input-bg: #2d2d2d;
            --secondary-color: #4da3ff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }

        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 1000;
            transition: 0.3s;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-section img {
            width: 150px;
            margin-bottom: 10px;
        }

        h2 {
            color: var(--secondary-color);
            margin: 0;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        #clock-display {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 20px;
            min-height: 20px;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.85rem;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            font-size: 1rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--text-main);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        textarea {
            padding-left: 45px;
            resize: vertical;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(0, 74, 173, 0.1);
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 480px) {
            .date-row { grid-template-columns: 1fr; }
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 74, 173, 0.3);
        }

        .loader {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body data-theme="light">

    <button class="theme-switch" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
        <i class="fas fa-moon" id="theme-icon"></i>
    </button>

    <div class="container">
        <div class="logo-section">
            <img src="imerch.png" alt="iMerch Logo">
            <h2>Incident Report Portal</h2>
            <p class="subtitle">Ensuring Excellence through Accountability</p>
            <div id="clock-display">Loading time...</div>
        </div>

        <form id="incidentForm">
            <div class="date-row">
                <div class="form-group">
                    <label>Reporter Full Name</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" name="fullname" placeholder="Your name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Subject Name</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user-tag"></i>
                        <input type="text" name="subjectName" placeholder="Name of person involved" required>
                    </div>
                </div>
            </div>

            <div class="date-row">
                <div class="form-group">
                    <label>Location of Incident</label>
                    <div class="input-with-icon">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" name="location" placeholder="Where it happened" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Category of Offenses</label>
                    <div class="input-with-icon">
                        <i class="fas fa-gavel"></i>
                        <select name="incidentType" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="Attendance and Punctuality">Attendance and Punctuality</option>
                            <option value="Work Performance & Duty">Work Performance & Duty</option>
                            <option value="Offenses Against Authority">Offenses Against Authority</option>
                            <option value="Offenses Against Persons">Offenses Against Persons</option>
                            <option value="Offenses Against Company Property & Interests">Offenses Against Company Property & Interests</option>
                            <option value="Dishonesty">Dishonesty</option>
                            <option value="Offenses against Public Morals">Offenses against Public Morals</option>
                            <option value="Offenses Against Health and Safety">Offenses Against Health and Safety</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="date-row">
                <div class="form-group">
                    <label>Date of Incident</label>
                    <div class="input-with-icon">
                        <i class="fas fa-calendar-day"></i>
                        <input type="date" name="incidentDate" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Time of Incident</label>
                    <div class="input-with-icon">
                        <i class="fas fa-clock"></i>
                        <input type="time" name="time" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Detailed Description</label>
                <div class="input-with-icon">
                    <i class="fas fa-edit" style="top: 22px;"></i>
                    <textarea name="description" rows="4" placeholder="Provide a full explanation of the incident (No character limit)..." required></textarea>
                </div>
            </div>

            <div class="form-group">
                <label>Attachments (Evidence/Multiple Files)</label>
                <div class="input-with-icon">
                    <i class="fas fa-paperclip"></i>
                    <input type="file" id="fileInput" name="attachments" multiple accept="image/*,.pdf,.doc,.docx">
                </div>
            </div>

            <input type="hidden" name="reportDate" id="reportDate">

            <button type="submit" class="btn-submit" id="submitBtn">
                <span>Submit Report</span>
                <div class="loader" id="loader"></div>
                <i class="fas fa-paper-plane" id="planeIcon"></i>
            </button>
        </form>

        <div class="footer-text">
            &copy; 2026 iMerch Media Inc. | System by Ronsanity
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const options = { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true 
            };
            document.getElementById('clock-display').textContent = now.toLocaleString('en-US', options);
        }
        setInterval(updateTime, 1000);
        updateTime();

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                icon.className = 'fas fa-sun';
            } else {
                body.setAttribute('data-theme', 'light');
                icon.className = 'fas fa-moon';
            }
        }

        // Set hidden report date to today
        document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];

        const scriptURL = 'https://script.google.com/macros/s/AKfycbypxmiP2xrHYwAbT27EhBS07aHMwbbh9OWDRKf7HXDyTlMJ8MfNm9gvZb6dV1AG8eGz/exec';
        const form = document.getElementById('incidentForm');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const icon = document.getElementById('planeIcon');

            btn.disabled = true;
            loader.style.display = 'block';
            icon.style.display = 'none';

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            const fileInput = document.getElementById('fileInput');
            const files = fileInput.files;
            const attachments = [];

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const base64Data = await toBase64(file);
                attachments.push({
                    base64: base64Data.split(',')[1],
                    type: file.type,
                    name: file.name
                });
            }
            data.attachments = attachments;

            fetch(scriptURL, { 
                method: 'POST', 
                body: JSON.stringify(data)
            })
            .then(res => {
                alert('Success! Incident report submitted.');
                form.reset();
                document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];
            })
            .catch(err => alert('Error: ' + err.message))
            .finally(() => {
                btn.disabled = false;
                loader.style.display = 'none';
                icon.style.display = 'block';
            });
        });

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    </script>
</body>
</html>
